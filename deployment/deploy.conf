# deploy.conf — the only project-specific file the Makefile and scripts/ read.
# To reuse them in another project, copy Makefile + scripts/ and write this file.
#
# Layout (always the same): app repos are siblings of this deployment repo.
#   <workspace>/<app repo>...
#   <workspace>/<this repo>/{deploy.conf,Makefile,scripts/,docker-compose.yml,.env,nginx/}
#
# Sourced by bash: keep it to plain assignments (and the project_checks hook).

# Project name. Host nginx config: nginx/$PROJECT.conf.template → /etc/nginx/conf.d/$PROJECT.conf
PROJECT=gozar

# Images built by `make build-image APP=<name>` (and by `make deploy` in local mode).
#   repo        sibling directory holding the source (override: <REPO>_DIR, e.g. GOZARGAH_DIR)
#   dockerfile  path inside the repo
#   build args  space-separated, each one of:
#                 KEY=VAL  fixed value
#                 KEY      value from .env; error when missing or empty
#                 KEY?     value from .env; when the key is absent the Dockerfile default stays
# The compose image variable is derived from the name: gozargah-worker → GOZARGAH_WORKER_IMAGE.
IMAGES=(
	# name          | repo     | dockerfile        | build args
	"gozargah        | gozargah | deploy/Dockerfile |"
	"gozargah-worker | gozargah | deploy/Dockerfile | CMD_PATH=./cmd/worker"
	"gozarban        | gozarban | Dockerfile        | NEXT_PUBLIC_API_BASE_URL NEXT_BASE_PATH?"
)

# Targets for `make deploy APP=<name>` (nginx and all are built in).
#   images    built in local mode before compose up (names from IMAGES)
#   services  compose services to start (empty row → none)
#   dirs      paths under this repo that must exist (e.g. mounted secrets)
TARGETS=(
	# name   | images          | services                        | dirs
	"gozargah | gozargah        | gozargah                        | gozargah/secrets"
	"workers  | gozargah-worker | vpn-conn-monitor clickhouse-sink | gozargah/secrets"
	"gozarban | gozarban        | gozarban                        |"
	"infra    |                 | nats postgres clickhouse ch-ui  |"
)

# Project-specific health checks for `make check`, run after .env is loaded.
# Helpers: check_http LABEL URL EXPECT_REGEX [CURL_ARGS...] and check_tcp LABEL HOST PORT.
project_checks() {
	check_http "gozargah direct" \
		"http://${GOZARGAH_BIND_ADDRESS:-127.0.0.1}:${GOZARGAH_HOST_PORT:-8080}/v1/auth/login" \
		'^(400|401|404|405|422|500)$'
	check_http "api via nginx" "https://127.0.0.1:35220/api/v1/auth/login" \
		'^(400|401|404|405|422|500)$' -k
	check_http "gozarban direct" \
		"http://${GOZARBAN_BIND_ADDRESS:-127.0.0.1}:${GOZARBAN_HOST_PORT:-8091}/admin" \
		'^(200|301|302|304|307|308)$'
	check_http "ch-ui direct" "http://${CH_UI_BIND_ADDRESS:-127.0.0.1}:${CH_UI_HOST_PORT:-9052}/" \
		'^(200|301|302|304)$'
	check_tcp "postgres" 127.0.0.1 "${POSTGRES_HOST_PORT:-9032}"
}
