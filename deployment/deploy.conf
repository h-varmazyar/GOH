# deploy.conf — the only project-specific file the Makefile and scripts/ read.
# To reuse them in another project, copy Makefile + scripts/ and write this file.
#
# Layout (always the same): app repos are siblings of this deployment repo.
#   <workspace>/<app repo>...
#   <workspace>/<this repo>/{deploy.conf,Makefile,scripts/,docker-compose.yml,.env,nginx/}
# Here the workspace is the GOH monorepo: GOH/{server,frontend,deployment}.
#
# Sourced by bash: keep it to plain assignments (and the project_checks hook).

# Project name. Host nginx config: nginx/$PROJECT.conf.template → /etc/nginx/conf.d/$PROJECT.conf
PROJECT=gatec

# Images built by `make build-image APP=<name>` (and by `make deploy` in local mode).
#   repo        sibling directory holding the source (override: <REPO>_DIR, e.g. SERVER_DIR)
#   dockerfile  path inside the repo
#   build args  space-separated, each one of:
#                 KEY=VAL  fixed value
#                 KEY      value from .env; error when missing or empty
#                 KEY?     value from .env; when the key is absent the Dockerfile default stays
# The compose image variable is derived from the name: server → SERVER_IMAGE.
#
# tdlib is the TDLib base image the server build copies its libraries from. Its
# image variable is TDLIB_IMAGE — the same name as the server Dockerfile's build
# arg — so a local deploy builds tdlib first, writes TDLIB_IMAGE=tdlib:local to
# .env and the server build picks it up. Unchanged, the tdlib build is a cache hit.
# The server image holds every binary (API, workers, airdrop catcher, signal
# replay); compose picks the binary per service with `entrypoint`.
IMAGES=(
	# name   | repo     | dockerfile              | build args
	"tdlib    | server   | deploy/tdlib.Dockerfile | GO_IMAGE? TDLIB_REF?"
	"server   | server   | deploy/Dockerfile       | TDLIB_IMAGE GO_IMAGE? RUNTIME_IMAGE?"
	"frontend | frontend | Dockerfile              | NEXT_PUBLIC_API_BASE_URL"
)

# Targets for `make deploy APP=<name>` (nginx and all are built in).
#   images    built in local mode before compose up (names from IMAGES)
#   services  compose services to start (empty row → none)
#   dirs      paths under this repo that must exist (e.g. mounted secrets)
# server, airdrop and workers share the server image: deploying one of them
# rebuilds it, the others keep running the previous build until redeployed.
TARGETS=(
	# name   | images       | services | dirs
	"server   | tdlib server | server airdrop-catcher | server/secrets"
	"airdrop  | tdlib server | airdrop-catcher | server/secrets"
	"workers  | tdlib server | candle-polling market-sync tse-market-data-sync tse-trade-history indicator-watch proxy-health-checker connection-monitor stock-market-sync stock-instrument-sync | server/secrets"
	"frontend | frontend     | frontend |"
	"infra    |              | nats postgres clickhouse ch-ui |"
)

# One-off tools for `make tool APP=<name> CMD="..."`: the compose service runs once
# (`compose run --rm`) and exits. Their services are in the compose profile
# "tools" so `compose up` / `make deploy` never start them.
#   image  built from IMAGES before the run (skip with ARGS="--no-build")
#   dirs   paths under this repo that must exist (e.g. mounted secrets)
TOOLS=(
	# name        | image  | dirs
	"worker        | server | server/secrets"
	"signal-replay | server | server/secrets"
)

# Project-specific health checks for `make check`, run after .env is loaded.
# Helpers: check_http LABEL URL EXPECT_REGEX [CURL_ARGS...] and check_tcp LABEL HOST PORT.
project_checks() {
	local host="${NGINX_SERVER_NAME:-gatec.ir}"

	check_http "server direct" \
		"http://${SERVER_BIND_ADDRESS:-127.0.0.1}:${SERVER_HOST_PORT:-8575}/v1/auth/login" \
		'^(400|401|404|405|422|500)$'
	check_http "api via nginx" "https://$host/api/v1/auth/login" \
		'^(400|401|404|405|422|500)$' -k --resolve "$host:443:127.0.0.1"
	check_http "frontend direct" \
		"http://${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_HOST_PORT:-8091}/" \
		'^200$'
	check_http "frontend via nginx" "https://$host/" '^200$' -k --resolve "$host:443:127.0.0.1"
	check_http "nats monitor" "http://127.0.0.1:${NATS_MONITOR_HOST_PORT:-9023}/healthz" '^200$'
	check_http "clickhouse" "http://127.0.0.1:${CLICKHOUSE_HTTP_HOST_PORT:-9043}/ping" '^200$'
	check_http "ch-ui direct" "http://${CH_UI_BIND_ADDRESS:-127.0.0.1}:${CH_UI_HOST_PORT:-9052}/" \
		'^(200|301|302|304)$'
	check_tcp "postgres" 127.0.0.1 "${POSTGRES_HOST_PORT:-9032}"
}
